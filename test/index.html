<script>
(function () {
  var KEY = "planer-test-v1";
  if (location.hash === "#reset") {
    try { localStorage.removeItem(KEY); } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  }
  var store = null;
  try { store = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { store = null; }
  if (!store || typeof store !== "object") store = {};

  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function clone(v) { return v == null ? v : JSON.parse(JSON.stringify(v)); }
  function isObj(v) { return v && typeof v === "object" && !Array.isArray(v); }
  function merge(t, p, top) {
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (v === null && !top) { delete t[k]; return; }
      if (isObj(v)) { if (!isObj(t[k])) t[k] = {}; merge(t[k], v, false); return; }
      t[k] = clone(v);
    });
  }
  var subs = [];
  function colSnap(name) {
    var pre = name + "/", docs = [];
    Object.keys(store).forEach(function (p) {
      if (p.indexOf(pre) === 0 && p.slice(pre.length).indexOf("/") < 0) {
        var v = store[p];
        docs.push({ id: p.slice(pre.length), exists: true, data: function () { return clone(v); } });
      }
    });
    return { docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } };
  }
  function docSnap(path) {
    var v = store[path];
    return { id: path.split("/").pop(), exists: v !== undefined, data: function () { return v === undefined ? undefined : clone(v); } };
  }
  function notify(path) {
    var col = path.slice(0, path.lastIndexOf("/"));
    subs.forEach(function (s) {
      if ((s.t === "c" && s.n === col) || (s.t === "d" && s.n === path)) {
        var snap = s.t === "c" ? colSnap(s.n) : docSnap(s.n);
        setTimeout(function () { s.cb(snap); }, 0);
      }
    });
  }
  function sub(t, n, cb) {
    var s = { t: t, n: n, cb: cb }; subs.push(s);
    setTimeout(function () { cb(t === "c" ? colSnap(n) : docSnap(n)); }, 0);
    return function () { var i = subs.indexOf(s); if (i >= 0) subs.splice(i, 1); };
  }
  function docRef(path) {
    return {
      id: path.split("/").pop(), path: path,
      get: function () { return Promise.resolve(docSnap(path)); },
      set: function (data, opt) {
        if (opt && opt.merge && isObj(store[path])) merge(store[path], data, true); else store[path] = clone(data);
        save(); notify(path); return Promise.resolve();
      },
      update: function (p) {
        if (!isObj(store[path])) return Promise.reject(new Error("Eintrag nicht gefunden."));
        merge(store[path], p, true); save(); notify(path); return Promise.resolve();
      },
      delete: function () { delete store[path]; save(); notify(path); return Promise.resolve(); },
      onSnapshot: function (cb) { return sub("d", path, cb); }
    };
  }
  function colRef(name) {
    return {
      doc: function (id) { return docRef(name + "/" + (id || Math.random().toString(36).slice(2, 10))); },
      get: function () { return Promise.resolve(colSnap(name)); },
      onSnapshot: function (cb) { return sub("c", name, cb); }
    };
  }
  var db = Object.freeze({ doc: docRef, collection: colRef });

  /* ---------- Beispieldaten, immer rund um die aktuelle Woche ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function seed() {
    var now = new Date(), iso = now.toISOString();
    var t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var mon = new Date(t0); mon.setDate(t0.getDate() - ((t0.getDay() + 6) % 7));
    function day(off) { var d = new Date(mon); d.setDate(mon.getDate() + off); return ymd(d); }
    var today = ymd(t0), ord = {};
    function slug(s) { return String(s).toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30); }
    function item(off, kind, title, emoji, start, end, tags, extra) {
      var date = off == null ? null : day(off);
      var o = Object.assign({
        kind: kind, title: title, emoji: emoji || "", date: date, start: start || null, end: end || null,
        est: null, until: null, tags: tags || [], note: "", done: false, doneAt: null, attachments: [],
        parent: null, createdAt: iso, updatedAt: iso, source: "test"
      }, extra || {});
      if (o.date && o.order == null) { ord[o.date] = (ord[o.date] || 0) + 1; o.order = ord[o.date]; }
      if (o.done && !o.doneAt) o.doneAt = iso;
      var id = (date || "x") + "-" + slug(title || emoji || kind) + "-" + Math.random().toString(36).slice(2, 6);
      store["items/" + id] = o;
    }
    function past(off) { return day(off) < today; }

    store["config/tags"] = { colors: {
      Arbeit: "#E12300", Home: "#6E7A84", Me: "#FF6900", Sport: "#2F8FD6", Freunde: "#E0959B", Familie: "#6446A8",
      Gesundheit: "#6FA85E", Geburtstag: "#D0557F", Essen: "#8BC4A8", Abo: "#D0457A", Wohnen: "#7E8890", Gehalt: "#3BAF5D", Kleidung: "#C056C8"
    } };

    for (var w = 0; w < 2; w++) {
      var b = w * 7;
      item(b + 0, "hinweis", w ? "Messe" : "Markt im Ort", "", null, null, ["Freunde"], { until: day(b + 1) });
      item(b + 0, "fahrt", "Fahrt", "", "07:40", "08:10", []);
      item(b + 0, "termin", "Team-Besprechung", "", "08:15", "09:15", ["Arbeit"]);
      item(b + 0, "termin", "Projekt Nord", "", "09:30", "12:00", ["Arbeit"]);
      item(b + 0, "termin", "Mittag mit Jana", "🥗", "12:15", "13:00", ["Freunde"]);
      item(b + 0, "aufgabe", "Rechnungen prüfen", "🧾", "13:15", "13:45", ["Arbeit"], { est: 30, done: past(b + 0) });
      item(b + 0, "termin", "Kundentermin", "", "14:00", "16:00", ["Arbeit"]);
      item(b + 0, "fahrt", "Fahrt", "", "16:00", "16:30", []);
      item(b + 0, "aktivitaet", "Spaziergang", "🚶", "18:00", "18:40", ["Me"]);
      item(b + 1, "fahrt", "Fahrt", "", "09:25", "09:55", []);
      item(b + 1, "termin", "Zahnarzt", "🦷", "10:00", "10:45", ["Gesundheit"]);
      item(b + 1, "termin", "Büro", "", "11:15", "16:30", ["Arbeit"]);
      item(b + 1, "aufgabe", "Einkaufen", "🛒", "17:00", "17:45", ["Home"], { est: 45, done: past(b + 1) });
      item(b + 2, "termin", "Workshop", "", "09:00", "13:00", ["Arbeit"]);
      item(b + 2, "notiz", "Ideen für den Urlaub", "💭", "13:30", null, ["Me"], { note: "- Ostsee oder Berge?\n- Zug oder Auto?" });
      item(b + 2, "termin", "Yoga", "🧘", "18:30", "19:30", ["Sport"]);
      item(b + 2, "aufgabe", "Paket abholen", "📦", null, null, ["Home"], { est: 15, done: past(b + 2) });
      item(b + 3, "termin", "Büro", "", "08:00", "12:00", ["Arbeit"]);
      item(b + 3, "termin", "Telefonat Bank", "📞", "13:00", "13:30", []);
      item(b + 3, "aufgabe", "Steuerunterlagen sortieren", "📁", null, null, ["Home"], { est: 60 });
      item(b + 4, "termin", "Büro", "", "08:00", "13:00", ["Arbeit"]);
      item(b + 4, "aufgabe", "Wäsche", "🧺", null, null, ["Home"], { est: 60 });
      item(b + 4, "termin", "Kino mit Tom", "🎬", "20:00", "22:30", ["Freunde"]);
      item(b + 5, "termin", "Wochenmarkt", "🥕", "09:00", "10:30", ["Home"]);
      item(b + 5, "hinweis", "Geburtstag Lisa", "🎂", null, null, ["Geburtstag"]);
      item(b + 5, "aktivitaet", "Joggen", "🏃", "16:00", "16:45", ["Sport"]);
      item(b + 6, "termin", "Brunch bei der Familie", "🥐", "11:00", "13:30", ["Familie"]);
      item(b + 6, "aufgabe", "Woche planen", "📝", "18:00", "18:20", ["Me"], { est: 20 });
      item(b + 0, "ausgabe", "Bäcker", "🥨", null, null, ["Essen"], { amount: -4.5 });
      item(b + 2, "ausgabe", "Buch", "📖", null, null, ["Me"], { amount: -14.99 });
    }
    item(0, "aufgabe", "Pflanzen umtopfen", "🪴", null, null, ["Home"], { est: 30 });
    item(1, "aufgabe", "Geschenk für Lisa", "🎁", null, null, ["Freunde"], { est: 20 });
    item(3, "aufgabe", "Arzttermin vereinbaren", "📅", null, null, ["Gesundheit"], { est: 10 });
    item(7, "ausgabe", "Gehalt", "💶", null, null, ["Gehalt"], { amount: 2500 });
    /* Fotos für den Überblick (aufgeklappt): zwei heute, eins vorgestern */
    var ti = (t0.getDay() + 6) % 7;
    function foto(n) { return { attachments: [{ id: "demo-foto-" + n, name: "Foto.jpg", type: "image/jpeg", size: 1 }] }; }
    item(ti, "aktivitaet", "Kaffeepause", "☕", "10:15", null, ["Me"], foto(2));
    item(ti, "aktivitaet", "Abendrunde am Feld", "🌅", "16:40", null, ["Me"], foto(1));
    item(ti - 2, "aktivitaet", "Bergblick", "⛰️", "15:20", null, ["Me"], foto(3));

    function series(id, o) {
      store["series/" + id] = Object.assign({ emoji: "", start: null, end: null, est: null, tags: [], note: "",
        from: null, until: null, done: {}, skip: {}, ov: {}, createdAt: iso, updatedAt: iso, source: "test" }, o);
    }
    var vit = {}; for (var i = -14; i < 0; i++) { var dd = new Date(t0); dd.setDate(t0.getDate() + i); if (i !== -3) vit[ymd(dd)] = iso; }
    series("s-vitamine", { kind: "habit", title: "Vitamine", emoji: "💊", est: 5, rule: { freq: "daily", interval: 1 }, anchor: day(-14), done: vit });
    series("s-sport", { kind: "termin", title: "Sport", emoji: "🏋️", start: "19:00", end: "20:00", tags: ["Sport"], rule: { freq: "weekly", interval: 1, byday: [2, 4] }, anchor: day(-14) });
    series("s-saugen", { kind: "habit", title: "Staubsaugen", emoji: "🧹", est: 30, tags: ["Home"], rule: { freq: "weekly", interval: 1, byday: [6] }, anchor: day(-8) });
    series("s-blumen", { kind: "habit", title: "Blumen gießen", emoji: "💧", est: 10, tags: ["Home"], rule: { freq: "daily", interval: 3 }, anchor: day(-6) });
    series("a-musik", { kind: "ausgabe", title: "Musik-Abo", emoji: "🎵", amount: -10.99, tags: ["Abo"], rule: { freq: "monthly", interval: 1, bymonthday: 5 }, anchor: day(-40) });
    series("a-miete", { kind: "ausgabe", title: "Miete", emoji: "🏠", amount: -800, tags: ["Wohnen"], rule: { freq: "monthly", interval: 1, bymonthday: 1 }, anchor: day(-40) });

    var syms = ["cloudy", "overcast", "rain", "showers", "fewclouds", "fewclouds", "sun", "cloudy", "rain", "overcast", "fewclouds", "sun", "showers", "cloudy"];
    for (var k = 0; k < 14; k++) {
      var mx = 6 + ((k * 5) % 7);
      store["weather/" + day(k)] = { date: day(k), max: mx, min: mx - 5, sym: syms[k],
        hours: { "9": { t: mx - 3, sym: syms[k] }, "12": { t: mx - 1, sym: syms[k] }, "15": { t: mx, sym: syms[k] }, "18": { t: mx - 2, sym: syms[k] } },
        src: "Beispiel", at: iso };
    }
    for (var j = -7; j <= 0; j++) {
      var dj = new Date(t0); dj.setDate(t0.getDate() + j);
      store["days/" + ymd(dj)] = { wake: "06:" + pad(20 + ((j + 7) * 4) % 30), bed: j < 0 ? "22:" + pad(30 + ((j + 7) * 7) % 25) : null, source: "test", updatedAt: iso };
    }
    store["books/b-sternenkarte"] = { title: "Die Sternenkarte", series: "", author: "A. Muster", pages: 420, format: "ebook", status: "reading",
      start: day(-10), end: null, cover: null, blurb: "Beispielbuch für die Testfassung.", blurbBy: "claude", link: "", note: "", createdAt: iso, updatedAt: iso, source: "test" };
    store["track/" + today] = { date: today, water: 3, coffee: 1, print: "b-sternenkarte", audio: null, updatedAt: iso };
    store["config/work"] = { soll: 160 };
    save();
  }
  if (!store["config/tags"]) seed();

  /* Anhänge (Fotos, Handschrift): im Browser-Speicher, ausgeliefert vom Service Worker unter _blob/<id> */
  var assets = null;
  if ("caches" in window && "serviceWorker" in navigator) {
    try { navigator.serviceWorker.register("sw.js"); } catch (e) {}
    assets = Object.freeze({
      upload: function (blob, opt) {
        var id = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        var type = (opt && opt.type) || blob.type || "application/octet-stream";
        var url = new URL("_blob/" + id, location.href).href;
        return caches.open("planer-blobs").then(function (c) {
          return c.put(url, new Response(blob, { headers: { "Content-Type": type } }));
        }).then(function () { return { id: id, contentType: type, sizeBytes: blob.size }; });
      }
    });
